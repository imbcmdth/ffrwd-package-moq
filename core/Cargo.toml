[package]
name = "moq-core"
version = "0.1.0"
edition = "2021"
description = "MoQ publishing for ffrwd/moq: fmp4 construction, group discipline, wasi transport"
license = "MIT OR Apache-2.0"

[dependencies]
bytes = "1"
moq-net = "0.2.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }

# The wasi connect path: quinn over quinn-wasi, wrapped in a raw
# web-transport session. Native builds (the muxer tests) never touch it.
[target.'cfg(target_os = "wasi")'.dependencies]
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "log"] }
quinn-wasi = { path = "../vendor/quinn-wasi" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
web-transport-quinn = { path = "../vendor/web-transport-quinn", default-features = false, features = ["ring"] }
webpki-roots = "1"
