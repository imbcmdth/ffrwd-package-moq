[package]
name = "publish"
version = "0.1.0"
edition = "2021"

[lib]
name = "publish"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytes = "1"
moq-core = { path = "../core" }
moq-net = "0.2.15"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "log"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }

# The DNS-over-HTTPS lookup rides wasi:http; native builds compile
# this crate to nothing and never need it.
[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "0.14"
